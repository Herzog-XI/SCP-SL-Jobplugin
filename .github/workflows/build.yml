name: Build FacilityJobs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build EXILED plugin
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify local references
        shell: powershell
        run: |
          $required = @(
            "lib\UnityEngine.CoreModule.dll",
            "lib\Assembly-CSharp-firstpass.dll"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required build reference is missing: $file"
            }
          }

          Write-Host "Required lib references found."
          Get-ChildItem lib

      - name: Restore packages
        run: nuget restore SCP-SL-Jobplugin.csproj

      - name: Build Release
        run: msbuild SCP-SL-Jobplugin.csproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Verify HintServiceMeow runtime assemblies
        shell: powershell
        run: |
          $releaseDirs = Get-ChildItem -Path bin -Directory -Recurse | Where-Object { $_.Name -eq "Release" }
          if (-not $releaseDirs) {
            throw "Release output directory was not found."
          }

          $meow = Get-ChildItem -Path bin -Recurse -File | Where-Object {
            $_.Name -like "HintServiceMeow*.dll"
          }

          if (-not $meow) {
            throw "HintServiceMeow runtime assemblies were not copied to the build output."
          }

          $meow | ForEach-Object { Write-Host "Found HintServiceMeow assembly: $($_.FullName)" }

      - name: Upload plugin and HintServiceMeow runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FacilityJobs
          path: |
            bin/**/Release/**/FacilityJobs.dll
            bin/**/Release/FacilityJobs.dll
            bin/**/Release/**/HintServiceMeow*.dll
            bin/**/Release/HintServiceMeow*.dll
          if-no-files-found: error
          retention-days: 14
